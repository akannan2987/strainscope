# .streamlit/config.toml: the app's settings (committed: it holds no secrets).
# Streamlit reads this file when the app is started from the project folder:
#     python -m streamlit run app/streamlit_app.py
# Every option is explained in docs/07-app.md, section 4.
# (Secrets never go here. They belong in .streamlit/secrets.toml, which Git ignores.)

[theme]
base = "light"
primaryColor = "#2E7D5B"              # buttons, sliders, links: the project's dark green
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F9FF"  # the sidebar and input boxes: the pale blue of the logo
textColor = "#1F2933"
# Phase 8, the accessibility check: darker shades of Streamlit's own colours,
# so small text keeps a contrast of at least 4.5 to 1 (the WCAG AA rule).
greenTextColor = "#11692C"            # the text of green notes (st.success)
grayTextColor = "#4B5563"             # the grey second line under a headline number
codeTextColor = "#1B5E3A"             # `code` in running text
# Pages use second-level headings under the title (a screen reader lists them in
# order); these sizes keep them looking as before (Streamlit's h2 is 2.25rem).
headingFontSizes = ["2.75rem", "1.75rem", "1.5rem", "1.25rem", "1rem", "0.875rem"]

[server]
maxUploadSize = 5                     # megabytes; an upload is a small CSV table
showEmailPrompt = false               # skip Streamlit's "enter your email" question on the first run

[browser]
gatherUsageStats = false              # don't send usage statistics to Streamlit

[client]
toolbarMode = "minimal"               # keep the menu in the top-right corner short
